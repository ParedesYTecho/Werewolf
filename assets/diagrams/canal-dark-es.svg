<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 352" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="canal-dark-es-title canal-dark-es-desc" id="canal-dark-es-root"><title id="canal-dark-es-title">Cerrar el canal sin silenciar al bot</title><desc id="canal-dark-es-desc">Antes de cerrar el canal para votar, el bot se concede permiso para escribir; si Discord lo rechaza, el canal se queda abierto.</desc><defs>
      <style>#canal-dark-es-root { --color-paper:#120b0e;--color-ink:#ece3d8;--color-muted:#a99a90;--color-accent:#e8667a;
--font-sans:'Geist', system-ui, sans-serif;--font-serif:'Instrument Serif', 'Noto Serif', serif;--font-mono:'Geist Mono', ui-monospace, monospace }
      #canal-dark-es-root { font-family: var(--font-sans); color: var(--color-ink); }
      #canal-dark-es-root .diagram-container { width:100%;overflow-x:auto }
      @media print {
#canal-dark-es-root .diagram-container { overflow-x:visible }
}</style><marker id="canal-dark-es-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#a99a90"/></marker><marker id="canal-dark-es-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#e8667a"/></marker><marker id="canal-dark-es-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#c9a55a"/></marker></defs><rect width="100%" height="100%" fill="#120b0e"/><path d="M200,100 H280" fill="none" stroke="#a99a90" stroke-width="1.2" marker-end="url(#canal-dark-es-arrow)"/><path d="M440,100 H520" fill="none" stroke="#a99a90" stroke-width="1.2" marker-end="url(#canal-dark-es-arrow)"/><path d="M680,100 H760" fill="none" stroke="#a99a90" stroke-width="1.2" marker-end="url(#canal-dark-es-arrow)"/><path d="M600,136 V208" fill="none" stroke="#e8667a" stroke-width="1.2" marker-end="url(#canal-dark-es-arrow-accent)"/><rect x="40" y="64" width="160" height="72" rx="6" fill="#120b0e"/><rect x="40" y="64" width="160" height="72" rx="6" fill="#1a1014" stroke="#ece3d8" stroke-width="1"/><text x="120.0" y="98.0" fill="#ece3d8" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Empieza la votación</text><text x="120.0" y="114.0" fill="#a99a90" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">el canal se va a cerrar</text><rect x="280" y="64" width="160" height="72" rx="6" fill="#120b0e"/><rect x="280" y="64" width="160" height="72" rx="6" fill="#1a1014" stroke="#ece3d8" stroke-width="1"/><text x="360.0" y="98.0" fill="#ece3d8" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Permiso al bot</text><text x="360.0" y="114.0" fill="#a99a90" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">enviar mensajes en el canal</text><polygon points="600,64.0 680.0,100 600,136.0 520.0,100" fill="#120b0e"/><polygon points="600,64.0 680.0,100 600,136.0 520.0,100" fill="#1a1014" stroke="#ece3d8" stroke-width="1"/><text x="600" y="97.0" fill="#ece3d8" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">¿Lo acepta</text><text x="600" y="111.0" fill="#ece3d8" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Discord?</text><rect x="760" y="64" width="160" height="72" rx="6" fill="#120b0e"/><rect x="760" y="64" width="160" height="72" rx="6" fill="#1a1014" stroke="#ece3d8" stroke-width="1"/><text x="840.0" y="98.0" fill="#ece3d8" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Cierra el canal</text><text x="840.0" y="114.0" fill="#a99a90" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">al resto, no al bot</text><rect x="520" y="208" width="160" height="72" rx="6" fill="#120b0e"/><rect x="520" y="208" width="160" height="72" rx="6" fill="#e8667a" stroke="#e8667a" stroke-width="1" fill-opacity="0.1"/><text x="600.0" y="242.0" fill="#ece3d8" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Canal abierto</text><text x="600.0" y="258.0" fill="#a99a90" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">el bot lo registra</text><rect x="708.0" y="80" width="24" height="12" rx="2" fill="#120b0e"/><text x="720" y="89" fill="#8f8178" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SÍ</text><rect x="612" y="152" width="24" height="12" rx="2" fill="#120b0e"/><text x="624.0" y="161" fill="#8f8178" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text><text x="40" y="228" fill="#a99a90" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">Mejor una partida con el canal</text><text x="40" y="246" fill="#a99a90" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">abierto que una sin voz.</text><line x1="40" y1="308" x2="920" y2="308" stroke="#ece3d8" stroke-width="0.8" stroke-opacity="0.1"/><text x="40" y="324" fill="#a99a90" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEYENDA</text><rect x="140" y="314" width="20" height="10" rx="2" fill="#1a1014" stroke="#ece3d8" stroke-width="1"/><text x="168" y="322" fill="#a99a90" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">Paso</text><polygon points="238,313 248,319 238,325 228,319" fill="#1a1014" stroke="#ece3d8" stroke-width="1"/><text x="256" y="322" fill="#a99a90" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">Decisión</text><rect x="336" y="314" width="20" height="10" rx="2" fill="#e8667a" stroke="#e8667a" stroke-width="1" fill-opacity="0.1"/><text x="364" y="322" fill="#a99a90" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">Decisión deliberada</text></svg>
