<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ciclo-light-en-title ciclo-light-en-desc" id="ciclo-light-en-root"><title id="ciclo-light-en-title">A match, start to finish</title><desc id="ciclo-light-en-desc">Lobby, role deal, then a night, day and vote loop that repeats until a side wins; the result then goes to the ranking.</desc><defs>
      <style>#ciclo-light-en-root { --color-paper:#f6f2ea;--color-ink:#1f1a14;--color-muted:#675e51;--color-accent:#af1d35;
--font-sans:'Geist', system-ui, sans-serif;--font-serif:'Instrument Serif', 'Noto Serif', serif;--font-mono:'Geist Mono', ui-monospace, monospace }
      #ciclo-light-en-root { font-family: var(--font-sans); color: var(--color-ink); }
      #ciclo-light-en-root .diagram-container { width:100%;overflow-x:auto }
      @media print {
#ciclo-light-en-root .diagram-container { overflow-x:visible }
}</style><marker id="ciclo-light-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#675e51"/></marker><marker id="ciclo-light-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#af1d35"/></marker><marker id="ciclo-light-en-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#7b5214"/></marker></defs><rect width="100%" height="100%" fill="#f6f2ea"/><path d="M200,100 H280" fill="none" stroke="#675e51" stroke-width="1.2" marker-end="url(#ciclo-light-en-arrow)"/><path d="M440,100 H520" fill="none" stroke="#675e51" stroke-width="1.2" marker-end="url(#ciclo-light-en-arrow)"/><path d="M680,100 H760" fill="none" stroke="#675e51" stroke-width="1.2" marker-end="url(#ciclo-light-en-arrow)"/><path d="M840,136 V216" fill="none" stroke="#675e51" stroke-width="1.2" marker-end="url(#ciclo-light-en-arrow)"/><path d="M760,252 H680" fill="none" stroke="#675e51" stroke-width="1.2" marker-end="url(#ciclo-light-en-arrow)"/><path d="M600,216 V136" fill="none" stroke="#af1d35" stroke-width="1.2" marker-end="url(#ciclo-light-en-arrow-accent)"/><path d="M520,252 H440" fill="none" stroke="#675e51" stroke-width="1.2" marker-end="url(#ciclo-light-en-arrow)"/><rect x="40" y="64" width="160" height="72" rx="6" fill="#f6f2ea"/><rect x="40" y="64" width="160" height="72" rx="6" fill="#fffaf0" stroke="#1f1a14" stroke-width="1"/><text x="120.0" y="98.0" fill="#1f1a14" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Lobby</text><text x="120.0" y="114.0" fill="#675e51" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">/start · /join</text><rect x="280" y="64" width="160" height="72" rx="6" fill="#f6f2ea"/><rect x="280" y="64" width="160" height="72" rx="6" fill="#fffaf0" stroke="#1f1a14" stroke-width="1"/><text x="360.0" y="98.0" fill="#1f1a14" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Deal</text><text x="360.0" y="114.0" fill="#675e51" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">role by private message</text><rect x="520" y="64" width="160" height="72" rx="6" fill="#f6f2ea"/><rect x="520" y="64" width="160" height="72" rx="6" fill="#af1d35" stroke="#af1d35" stroke-width="1" fill-opacity="0.08"/><text x="600.0" y="98.0" fill="#1f1a14" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Night</text><text x="600.0" y="114.0" fill="#675e51" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">role abilities</text><rect x="760" y="64" width="160" height="72" rx="6" fill="#f6f2ea"/><rect x="760" y="64" width="160" height="72" rx="6" fill="#fffaf0" stroke="#1f1a14" stroke-width="1"/><text x="840.0" y="98.0" fill="#1f1a14" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Day</text><text x="840.0" y="114.0" fill="#675e51" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">debate in the channel</text><rect x="760" y="216" width="160" height="72" rx="6" fill="#f6f2ea"/><rect x="760" y="216" width="160" height="72" rx="6" fill="#fffaf0" stroke="#1f1a14" stroke-width="1"/><text x="840.0" y="250.0" fill="#1f1a14" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Vote</text><text x="840.0" y="266.0" fill="#675e51" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">eliminate one player</text><polygon points="600,216.0 680.0,252 600,288.0 520.0,252" fill="#f6f2ea"/><polygon points="600,216.0 680.0,252 600,288.0 520.0,252" fill="#fffaf0" stroke="#1f1a14" stroke-width="1"/><text x="600" y="249.0" fill="#1f1a14" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Is there</text><text x="600" y="263.0" fill="#1f1a14" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">a winner?</text><rect x="280" y="216" width="160" height="72" rx="6" fill="#f6f2ea"/><rect x="280" y="216" width="160" height="72" rx="6" fill="#fffaf0" stroke="#1f1a14" stroke-width="1"/><text x="360.0" y="250.0" fill="#1f1a14" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Result</text><text x="360.0" y="266.0" fill="#675e51" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">server ranking</text><rect x="464.0" y="232" width="32" height="12" rx="2" fill="#f6f2ea"/><text x="480" y="241" fill="#5b5448" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="612" y="152" width="88" height="12" rx="2" fill="#f6f2ea"/><text x="656.0" y="161" fill="#5b5448" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ANOTHER NIGHT</text><text x="40" y="244" fill="#675e51" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">One Night skips the loop:</text><text x="40" y="262" fill="#675e51" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">one night and one vote.</text><line x1="40" y1="336" x2="920" y2="336" stroke="#1f1a14" stroke-width="0.8" stroke-opacity="0.1"/><text x="40" y="352" fill="#675e51" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text><rect x="140" y="342" width="20" height="10" rx="2" fill="#af1d35" stroke="#af1d35" stroke-width="1" fill-opacity="0.08"/><text x="168" y="350" fill="#675e51" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">Repeating phase</text><rect x="288" y="342" width="20" height="10" rx="2" fill="#fffaf0" stroke="#1f1a14" stroke-width="1"/><text x="316" y="350" fill="#675e51" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">Step</text><polygon points="386,341 396,347 386,353 376,347" fill="#fffaf0" stroke="#1f1a14" stroke-width="1"/><text x="404" y="350" fill="#675e51" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">Decision</text></svg>
