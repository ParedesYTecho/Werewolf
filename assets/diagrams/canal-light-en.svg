<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 352" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="canal-light-en-title canal-light-en-desc" id="canal-light-en-root"><title id="canal-light-en-title">Locking the channel without muting the bot</title><desc id="canal-light-en-desc">Before the channel is locked for voting, the bot grants itself permission to write; if Discord refuses, the channel stays open.</desc><defs>
      <style>#canal-light-en-root { --color-paper:#f6f2ea;--color-ink:#1f1a14;--color-muted:#675e51;--color-accent:#af1d35;
--font-sans:'Geist', system-ui, sans-serif;--font-serif:'Instrument Serif', 'Noto Serif', serif;--font-mono:'Geist Mono', ui-monospace, monospace }
      #canal-light-en-root { font-family: var(--font-sans); color: var(--color-ink); }
      #canal-light-en-root .diagram-container { width:100%;overflow-x:auto }
      @media print {
#canal-light-en-root .diagram-container { overflow-x:visible }
}</style><marker id="canal-light-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#675e51"/></marker><marker id="canal-light-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#af1d35"/></marker><marker id="canal-light-en-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#7b5214"/></marker></defs><rect width="100%" height="100%" fill="#f6f2ea"/><path d="M200,100 H280" fill="none" stroke="#675e51" stroke-width="1.2" marker-end="url(#canal-light-en-arrow)"/><path d="M440,100 H520" fill="none" stroke="#675e51" stroke-width="1.2" marker-end="url(#canal-light-en-arrow)"/><path d="M680,100 H760" fill="none" stroke="#675e51" stroke-width="1.2" marker-end="url(#canal-light-en-arrow)"/><path d="M600,136 V208" fill="none" stroke="#af1d35" stroke-width="1.2" marker-end="url(#canal-light-en-arrow-accent)"/><rect x="40" y="64" width="160" height="72" rx="6" fill="#f6f2ea"/><rect x="40" y="64" width="160" height="72" rx="6" fill="#fffaf0" stroke="#1f1a14" stroke-width="1"/><text x="120.0" y="98.0" fill="#1f1a14" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Vote starts</text><text x="120.0" y="114.0" fill="#675e51" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">the channel is about to lock</text><rect x="280" y="64" width="160" height="72" rx="6" fill="#f6f2ea"/><rect x="280" y="64" width="160" height="72" rx="6" fill="#fffaf0" stroke="#1f1a14" stroke-width="1"/><text x="360.0" y="98.0" fill="#1f1a14" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Grant the bot</text><text x="360.0" y="114.0" fill="#675e51" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">send messages in channel</text><polygon points="600,64.0 680.0,100 600,136.0 520.0,100" fill="#f6f2ea"/><polygon points="600,64.0 680.0,100 600,136.0 520.0,100" fill="#fffaf0" stroke="#1f1a14" stroke-width="1"/><text x="600" y="97.0" fill="#1f1a14" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Does Discord</text><text x="600" y="111.0" fill="#1f1a14" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">accept it?</text><rect x="760" y="64" width="160" height="72" rx="6" fill="#f6f2ea"/><rect x="760" y="64" width="160" height="72" rx="6" fill="#fffaf0" stroke="#1f1a14" stroke-width="1"/><text x="840.0" y="98.0" fill="#1f1a14" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Lock the channel</text><text x="840.0" y="114.0" fill="#675e51" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">for others, not the bot</text><rect x="520" y="208" width="160" height="72" rx="6" fill="#f6f2ea"/><rect x="520" y="208" width="160" height="72" rx="6" fill="#af1d35" stroke="#af1d35" stroke-width="1" fill-opacity="0.08"/><text x="600.0" y="242.0" fill="#1f1a14" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Channel stays open</text><text x="600.0" y="258.0" fill="#675e51" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">the bot logs it</text><rect x="704.0" y="80" width="32" height="12" rx="2" fill="#f6f2ea"/><text x="720" y="89" fill="#5b5448" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="612" y="152" width="24" height="12" rx="2" fill="#f6f2ea"/><text x="624.0" y="161" fill="#5b5448" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text><text x="40" y="228" fill="#675e51" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">Better a match with an open</text><text x="40" y="246" fill="#675e51" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">channel than one without a voice.</text><line x1="40" y1="308" x2="920" y2="308" stroke="#1f1a14" stroke-width="0.8" stroke-opacity="0.1"/><text x="40" y="324" fill="#675e51" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text><rect x="140" y="314" width="20" height="10" rx="2" fill="#fffaf0" stroke="#1f1a14" stroke-width="1"/><text x="168" y="322" fill="#675e51" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">Step</text><polygon points="238,313 248,319 238,325 228,319" fill="#fffaf0" stroke="#1f1a14" stroke-width="1"/><text x="256" y="322" fill="#675e51" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">Decision</text><rect x="336" y="314" width="20" height="10" rx="2" fill="#af1d35" stroke="#af1d35" stroke-width="1" fill-opacity="0.08"/><text x="364" y="322" fill="#675e51" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">Deliberate decision</text></svg>
